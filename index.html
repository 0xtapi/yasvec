<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ece9e1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
    <meta
      name="description"
      content="An interactive 3D model viewer for Vectorworks models."
    />
    <title>Vectorapp</title>
  </head>
  <body>
    <main class="app-shell">
      <section
        class="viewer-wrap"
        id="drop-zone"
        data-backdrop="dark"
        aria-label="Interactive 3D model viewer"
      >
        <canvas
          id="viewer"
          class="viewer-canvas"
          aria-label="Interactive 3D model"
        ></canvas>

        <div class="loading" id="loading" hidden>
          <span class="loading-label" id="loading-label">Loading model…</span>
          <span class="progress-track" aria-hidden="true">
            <span class="progress-bar" id="progress-bar"></span>
          </span>
        </div>

        <div class="viewer-controls" id="viewer-controls" hidden>
          <button
            class="control-button"
            id="lighting-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="lighting-panel"
            title="Adjust lighting"
          >
            Lighting
          </button>
          <button class="control-button" id="reset-view" type="button" title="Reset view">
            Reset view
          </button>
        </div>

        <div class="lighting-panel" id="lighting-panel" hidden>
          <div class="panel-heading">
            <div>
              <span class="panel-eyebrow">Appearance</span>
              <strong>Lighting</strong>
            </div>
            <button class="panel-close" id="lighting-close" type="button" aria-label="Close lighting controls">
              ×
            </button>
          </div>

          <label class="setting-row" for="tone-mapping-control">
            <span>Tone mapping</span>
            <select id="tone-mapping-control">
              <option value="neutral">Neutral</option>
              <option value="agx">AgX</option>
              <option value="aces">ACES</option>
            </select>
          </label>

          <label class="setting-slider" for="exposure-control">
            <span>
              <span>Brightness</span>
              <output id="exposure-value" for="exposure-control">0.20</output>
            </span>
            <input
              id="exposure-control"
              type="range"
              min="0.10"
              max="1.45"
              step="0.05"
              value="0.20"
            />
          </label>

          <label class="setting-slider" for="light-direction-control">
            <span>
              <span>Light direction</span>
              <output id="light-direction-value" for="light-direction-control">30°</output>
            </span>
            <input
              id="light-direction-control"
              type="range"
              min="0"
              max="360"
              step="1"
              value="30"
            />
            <small>Soft shadows follow the light direction.</small>
          </label>

          <p class="environment-credit">
            Studio light: <a href="https://polyhaven.com/a/studio_small_03" target="_blank" rel="noreferrer">Poly Haven · CC0</a>
          </p>
        </div>

        <p class="error-message" id="error-message" role="alert" hidden></p>
      </section>

      <footer class="helpbar">
        <span><strong>Drag</strong> to rotate</span>
        <span><strong>Scroll or pinch</strong> to zoom</span>
        <span><strong>Right-drag</strong> to pan</span>
      </footer>
    </main>
    <script>
      window.__vectorappStartupTimer = window.setTimeout(() => {
        const message = document.querySelector('#error-message');
        if (!message) return;

        message.textContent =
          'The 3D viewer did not start. Run npm install and npm run dev, then open the localhost URL printed in the terminal. Do not open index.html directly.';
        message.hidden = false;
      }, 2500);
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
